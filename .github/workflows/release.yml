name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Get application version
        id: loadversion
        shell: pwsh
        run: |
          python src/scripts/build_lunatranslator.py loadversion | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build C++ and Plugins (Win10/11 x64)
        run: |
          python src/scripts/build_lunatranslator.py cpp x64 win10

      - name: Build LunaHook (Win10/11 x64)
        run: |
          python src/scripts/build_lunatranslator.py hook x64 win10

      - name: Collect Python Runtime
        run: |
          python src/scripts/build_lunatranslator.py pyrt x64 3.13 win10

      - name: Merge and assemble package
        run: |
          python src/scripts/build_lunatranslator.py merge x64 win10

      - name: Self-sign executables and DLLs
        shell: pwsh
        run: |
          Write-Host "Creating self-signed code signing certificate..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=LunaTranslator" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256

          Write-Host "Signing all executables and DLLs..."
          Get-ChildItem -Path "src/build/LunaTranslator_x64" -Recurse -Include *.exe, *.dll | ForEach-Object {
              try {
                  Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256 -ErrorAction Stop
              } catch {
                  Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert -HashAlgorithm SHA256
              }
          }
          Write-Host "Self-signing completed."

      - name: Compress release package
        shell: pwsh
        run: |
          Push-Location "src/build"
          & "C:\Program Files\7-Zip\7z.exe" a -m0=Deflate -mx9 "LunaTranslator_x64.zip" "LunaTranslator_x64"
          Move-Item "LunaTranslator_x64.zip" "../../LunaTranslator_x64.zip" -Force
          Pop-Location
          Write-Host "Created LunaTranslator_x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunaTranslator_x64
          path: LunaTranslator_x64.zip

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $TAG = "${{ steps.loadversion.outputs.version }}"
          Write-Host "Processing release for tag: $TAG"

          $releaseCheck = gh release view $TAG 2>&1
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $TAG already exists. Uploading and overwriting LunaTranslator_x64.zip..."
              gh release upload $TAG "LunaTranslator_x64.zip" --clobber
          } else {
              Write-Host "Release $TAG does not exist. Creating new release..."
              gh release create $TAG "LunaTranslator_x64.zip" --title $TAG --generate-notes
          }
          Write-Host "Release asset deployed successfully."

      - name: Notify update server
        if: env.LUNA_NOTIFY != ''
        env:
          LUNA_NOTIFY: ${{ secrets.LUNA_UPDATE_NOTIFY }}
        run: |
          curl -s "http://lunatranslator.org/${{ secrets.LUNA_UPDATE_NOTIFY }}" || true
